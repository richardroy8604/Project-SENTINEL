<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#07080d"/>
    </radialGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#00838f"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Outer Hexagonal Reticle -->
  <polygon points="256,42 436,146 436,354 256,458 76,354 76,146" 
           fill="none" stroke="#00e5ff" stroke-width="6" stroke-opacity="0.4" stroke-dasharray="14 10"/>
           
  <polygon points="256,66 414,158 414,342 256,434 98,342 98,158" 
           fill="#0d111d" stroke="url(#cyanGlow)" stroke-width="8" filter="url(#glow)"/>

  <!-- Tech Crosshairs -->
  <line x1="256" y1="100" x2="256" y2="170" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="342" x2="256" y2="412" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="130" y1="256" x2="200" y2="256" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="312" y1="256" x2="382" y2="256" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>

  <!-- Tactical Core Ring -->
  <circle cx="256" cy="256" r="85" fill="none" stroke="#ff1744" stroke-width="5" stroke-dasharray="24 12" stroke-opacity="0.8"/>
  <circle cx="256" cy="256" r="60" fill="#1b0811" stroke="url(#redGlow)" stroke-width="6" filter="url(#glow)"/>
  
  <!-- Ultron Eye Center Pupil -->
  <circle cx="256" cy="256" r="28" fill="#ff1744"/>
  <circle cx="256" cy="256" r="14" fill="#ffffff"/>
  
  <!-- Subtle Corner Accents -->
  <path d="M 120 170 L 140 170 L 140 190" fill="none" stroke="#00e5ff" stroke-width="3"/>
  <path d="M 392 170 L 372 170 L 372 190" fill="none" stroke="#00e5ff" stroke-width="3"/>
  <path d="M 120 330 L 140 330 L 140 310" fill="none" stroke="#00e5ff" stroke-width="3"/>
  <path d="M 392 330 L 372 330 L 372 310" fill="none" stroke="#00e5ff" stroke-width="3"/>
</svg>
